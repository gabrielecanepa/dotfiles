name: Bug report
description: Something in the dotfiles misbehaves on this or a fresh machine
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug, starting from a fresh shell when relevant.
      placeholder: |
        1. Open a new shell
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, with terminal output when relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, related issues, macOS or tool versions, or anything else that helps diagnose the problem.
    validations:
      required: false
